[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsplat-utils"
version = "0.1.0"
description = "Video or image folder -> COLMAP -> Gaussian Splat -> web viewer / building geometry diagram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "pycolmap>=3.10",
]

[project.optional-dependencies]
# GPU training of the Gaussian splat (needs CUDA + a recent PyTorch).
train = ["torch>=2.1", "gsplat>=1.3"]
# Mesh sanity checks / extra export formats.
mesh = ["trimesh>=4.0"]
# Bundled ffmpeg binary when none is on PATH.
ffmpeg = ["imageio-ffmpeg>=0.4"]
dev = ["pytest>=7", "trimesh>=4.0"]

[project.scripts]
gsu = "gsplat_utils.cli:main"

[tool.setuptools.packages.find]
include = ["gsplat_utils*"]

[tool.setuptools.package-data]
"gsplat_utils.web" = ["template/*", "template/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
